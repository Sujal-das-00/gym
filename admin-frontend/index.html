<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#073f2d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Admin" />
  <meta name="description" content="Gym management dashboard for members, attendance, and payments." />
  <link rel="manifest" href="/manifest.json" />
  <script>
    // Flag standalone/installed launches early so app-only UI applies before first paint.
    if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true) {
      document.documentElement.classList.add("pwa");
    }
  </script>
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="icon" href="/icons/icon-192.svg" />
  <title>Gym Admin Dashboard</title>
  <!-- Google Material Symbols icon font: <span class="material-symbols-outlined">payments</span> -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
